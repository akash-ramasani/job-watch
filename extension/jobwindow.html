<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobWatch applications</title>
<link rel="icon" href="icons/icon128.png">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #334155; }
  @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #cbd5e1; } }
  main { max-width: 420px; padding: 24px; text-align: center; }
  img { width: 48px; height: 48px; }
  h1 { font-size: 18px; margin: 12px 0 6px; }
  p { margin: 0; }
</style>
</head>
<body>
<main>
  <img src="icons/icon128.png" alt="">
  <h1>JobWatch auto-apply window</h1>
  <p>Applications open as tabs in this window. It stays minimized; you can leave it be. Closing it is fine too: the next application opens a new one.</p>
</main>
</body>
</html>
